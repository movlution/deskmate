name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build Deskmate.exe from source
        shell: cmd
        run: build.cmd
      - name: Smoke test
        shell: powershell
        run: .\tests\run_e2e.ps1 -TestFile .\tests\smoke_test.ps1
      - name: Feature regression checks
        shell: powershell
        run: .\tests\run_feature_checks.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build per-user installer
        shell: cmd
        run: build-installer.cmd "%CD%\Deskmate.exe"
      - name: SHA-256
        shell: pwsh
        run: Get-FileHash Deskmate.exe, release\Deskmate-Setup.exe -Algorithm SHA256 | Format-Table Hash, Path -AutoSize
      - uses: actions/upload-artifact@v7
        with:
          name: Deskmate
          path: |
            Deskmate.exe
            release/Deskmate-Setup.exe
          if-no-files-found: error
